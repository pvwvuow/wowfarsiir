<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><title>zl tmp</title></head><body><pre id="out">running</pre><script>
(async function(){
const J=async u=>{try{const r=await fetch(u+'?t='+Date.now());if(!r.ok)return null;return await r.json();}catch(e){return null}};
const meta=(await J('data/forever/db/zones-meta.json')).zones;
const out={fit:{},zones:{}};
function ols(xs,ys){const n=xs.length;if(n<2)return null;let sx=0,sy=0,sxx=0,sxy=0;for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxx+=xs[i]*xs[i];sxy+=xs[i]*ys[i];}const d=n*sxx-sx*sx;if(!d)return null;const k=(n*sxy-sx*sy)/d,a=(sy-k*sx)/n;let e=0;for(let i=0;i<n;i++){const r=ys[i]-(a+k*xs[i]);e+=r*r;}return{a,k,rms:Math.sqrt(e/n),n};}
function med(v){v=v.slice().sort((x,y)=>x-y);return v[Math.floor(v.length/2)];}
for(const cont of ['kalimdor','eastern-kingdoms']){
const C=await J('data/forever/db/poi/map-'+cont+'.json');const ci={};
for(const p of C.pts){if(p[3]&&!ci[p[3]])ci[p[3]]=[p[1],p[2]];}
const zs=meta.filter(z=>z.id!=null&&z.continent===cont&&(z.kind==='zone'||z.kind==='city'));
const Zd={};const pairs=[];
for(const z of zs){const d=await J('data/forever/db/map/zone-'+z.id+'.json');const P=await J('data/forever/db/poi/map-'+z.slug+'.json');if(!d||!d.bounds){out.zones[z.slug]={err:'nobounds'};continue;}Zd[z.slug]={z,d};
if(P)for(const p of P.pts){if(p[3]&&ci[p[3]]){const b=d.bounds;pairs.push({s:z.slug,u:p[1]/100,v:p[2]/100,b,c:ci[p[3]]});}}}
const combos={};
for(const ax of [0,1]){for(const ay of [0,1]){
const X=pairs.map(q=>ax===0?q.b[0]+q.u*(q.b[2]-q.b[0]):q.b[1]+q.v*(q.b[3]-q.b[1]));
const Y=pairs.map(q=>ay===0?q.b[0]+q.u*(q.b[2]-q.b[0]):q.b[1]+q.v*(q.b[3]-q.b[1]));
const fx=ols(X,pairs.map(q=>q.c[0])),fy=ols(Y,pairs.map(q=>q.c[1]));combos[ax+''+ay]={fx,fy};}}
out.fit[cont]={pairs:pairs.length,combos};
let best=null;for(const k of Object.keys(combos)){const c=combos[k];if(!c.fx||!c.fy)continue;if(k[0]===k[1])continue;const s=c.fx.rms+c.fy.rms;if(!best||s<best.s)best={k,s};}
out.fit[cont].best=best;
if(!best)continue;const cb=combos[best.k];const ax=+best.k[0],ay=+best.k[1];
for(const slug of Object.keys(Zd)){const {z,d}=Zd[slug];const b=d.bounds;
const cx=(u)=>{const W=ax===0?b[0]+u*(b[2]-b[0]):b[1]+u*(b[3]-b[1]);return cb.fx.a+cb.fx.k*W;};
const cy=(v)=>{const W=ay===0?b[0]+v*(b[2]-b[0]):b[1]+v*(b[3]-b[1]);return cb.fy.a+cb.fy.k*W;};
const xs=[],ys=[];for(const L of Object.keys(d.layers||{})){for(const e of d.layers[L]){if(typeof e[1]==='number'&&typeof e[2]==='number'){xs.push(e[1]);ys.push(e[2]);}}}
const r={name:z.name,kind:z.kind,pins:xs.length,rect:[cx(0),cy(0),cx(1),cy(1)].map(n=>Math.round(n*10)/10)};
if(xs.length){r.cen=[Math.round(cx(med(xs)/100)*10)/10,Math.round(cy(med(ys)/100)*10)/10];}
r.mid=[Math.round(cx(.5)*10)/10,Math.round(cy(.5)*10)/10];out.zones[slug]=r;}
}
document.getElementById('out').textContent=JSON.stringify(out);
})();
</script></body></html>
