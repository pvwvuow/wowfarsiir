<script>
/* Forever pages get the skyborne background: mirror of retail.js itvVer() —
   ?ver wins, then localStorage (itv-ver). switchVer() navigates, so this
   load-time check is enough (and runs before retail.js paints .bg-layers). */
(function () {
  var v = new URLSearchParams(location.search).get("ver");
  if (v !== "retail" && v !== "forever") {
    try { v = localStorage.getItem("itv-ver") === "forever" ? "forever" : "retail"; } catch (e) { v = "retail"; }
  }
  if (v === "forever") document.documentElement.classList.add("itv-forever");
})();
</script>
